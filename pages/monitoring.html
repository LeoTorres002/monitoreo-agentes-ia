<!DOCTYPE html>
<html lang="es" class="h-full bg-white antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoreo Agentes de IA — Monitoreo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        indigo: { ink: '#32b118', hover: '#3dc920' },
                        midnight: { ink: '#061b31' },
                        slate: '#64748d', steel: '#50617a', smoke: '#839bc8',
                        mist: '#f4fbf3', frost: '#e5edf5',
                        lavender: { border: '#b9f9be' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="min-h-full flex flex-col bg-white text-midnight-ink font-light">

    <!-- NAV -->
    <header class="h-[76px] border-b border-frost bg-white sticky top-0 z-50 flex items-center">
        <div class="max-w-[1320px] w-full mx-auto px-4 sm:px-6 flex items-center justify-between gap-2">
            <div class="flex items-center space-x-3 sm:space-x-8 min-w-0">
                <a href="../index.html" class="text-[16px] sm:text-[20px] font-normal tracking-tight flex items-center gap-2 shrink-0">
                    <span class="w-2.5 h-2.5 bg-indigo-ink rounded-sm shrink-0"></span>
                    <span class="truncate">Monitoreo agentes IA</span>
                </a>
                <nav class="flex items-center space-x-4 sm:space-x-6 text-[13px] sm:text-[14px] font-normal">
                    <a href="../index.html" class="hover:text-indigo-ink transition-colors py-1 px-0.5">Inicio</a>
                    <a href="monitoring.html" class="text-indigo-ink py-1 px-0.5">Monitoreo</a>
                    <a href="statistics.html" class="hover:text-indigo-ink transition-colors py-1 px-0.5">Estadísticas</a>
                </nav>
            </div>
            <span class="inline-flex items-center px-2 sm:px-2.5 py-1 rounded-full text-[11px] sm:text-[12px] bg-mist border border-frost text-steel shrink-0">
                <span class="w-1.5 h-1.5 rounded-full bg-slate mr-1.5 sm:mr-2" id="status-dot"></span>
                <span id="status-text">Inactivo</span>
            </span>

        </div>
    </header>

   <main class="flex-1 max-w-[1320px] w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 space-y-8">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
        <div>
            <p class="text-[12px] text-smoke uppercase tracking-[0.5px]">Monitoreo de Flujo</p>
            <h1 class="text-[28px] sm:text-[38px] md:text-[48px] leading-[1.03] tracking-heading-lg text-midnight-ink mt-1">
                Eventos en Tiempo Real
            </h1>
        </div>
        
        <!-- Agrupación de acciones para responsividad en móvil -->
        <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-3 w-full md:w-auto">
            <a href="statistics.html" id="btn-to-stats" class="w-full sm:w-auto h-[48px] px-5 border border-lavender-border text-indigo-ink hover:bg-mist text-[14px] font-normal rounded-md transition-colors inline-flex items-center justify-center shrink-0">
                Ver Ventana de Estadísticas ›
            </a>
            <button id="btn-clean" disabled class="w-full sm:w-auto h-[48px] px-5 bg-indigo-ink hover:bg-indigo-hover disabled:bg-frost disabled:text-slate text-white text-[14px] font-normal rounded-md transition-colors inline-flex items-center justify-center space-x-2 shrink-0">
                <span>Limpiar eventos</span>
            </button>
        </div>
    </div>

    <!-- TERMINAL LOG RESPONSIVA -->
    <div class="bg-mist border border-[#32b118]/40 rounded-md p-4 sm:p-6 font-mono text-[12px] sm:text-[13px] leading-[1.6] space-y-3 h-[380px] sm:h-[420px] overflow-y-auto" id="terminal-stream">
    </div>
</main>

    <script src="../js/main.js"></script>
</body>
</html>
